{% extends "base.html" %}

{% block body %}
<!-- Student Sub-Navbar with Navigation & Search -->
<div class="bg-body-tertiary border-bottom py-2">
    <div class="container-fluid px-4 d-flex flex-wrap align-items-center justify-content-between gap-3">
        <!-- Navigation Links -->
        <ul class="nav nav-pills gap-1 flex-wrap">
            <li class="nav-item">
                <a class="nav-link rounded-pill px-3 py-1 small {% if request.endpoint == 'student.dashboard' %}active{% endif %}" href="{{ url_for('student.dashboard') }}">
                    <i class="bi bi-house-door me-1"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link rounded-pill px-3 py-1 small {% if request.endpoint == 'student.subjects_list' %}active{% endif %}" href="{{ url_for('student.subjects_list') }}">
                    <i class="bi bi-journal-bookmark me-1"></i> Subjects
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link rounded-pill px-3 py-1 small {% if request.endpoint == 'student.search' %}active{% endif %}" href="{{ url_for('student.search') }}">
                    <i class="bi bi-search me-1"></i> Explore & Search
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link rounded-pill px-3 py-1 small {% if request.endpoint == 'student.bookmarks' %}active{% endif %}" href="{{ url_for('student.bookmarks') }}">
                    <i class="bi bi-bookmark-fill me-1"></i> Bookmarks
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link rounded-pill px-3 py-1 small {% if request.endpoint == 'student.history' %}active{% endif %}" href="{{ url_for('student.history') }}">
                    <i class="bi bi-clock-history me-1"></i> Reading History
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link rounded-pill px-3 py-1 small {% if request.endpoint == 'student.notes' %}active{% endif %}" href="{{ url_for('student.notes') }}">
                    <i class="bi bi-journal-text me-1"></i> Study Notes
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link rounded-pill px-3 py-1 small {% if request.endpoint == 'student.downloads' %}active{% endif %}" href="{{ url_for('student.downloads') }}">
                    <i class="bi bi-download me-1"></i> Downloads
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link rounded-pill px-3 py-1 small {% if request.endpoint == 'student.interests' %}active{% endif %}" href="{{ url_for('student.interests') }}">
                    <i class="bi bi-compass me-1"></i> My Interests
                </a>
            </li>
        </ul>

        <!-- Search Bar within Shared Global Library -->
        <form class="d-flex" action="{{ url_for('student.search') }}" method="GET" style="max-width: 280px; width: 100%;">
            <div class="input-group input-group-sm">
                <input class="form-control rounded-start-pill" type="search" name="q" placeholder="Search textbooks, notes..." value="{{ request.args.get('q', '') }}">
                <button class="btn btn-primary rounded-end-pill px-3" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<div class="container-fluid px-4 py-4">
    {% block student_content %}{% endblock %}
</div>
{% endblock %}
