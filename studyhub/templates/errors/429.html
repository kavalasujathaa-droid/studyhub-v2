{% extends "base.html" %}
{% block title %}429 - Rate Limit Exceeded{% endblock %}
{% block body %}
<div class="container py-5 text-center">
    <div class="sh-stat-icon bg-warning text-dark mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2rem;">
        <i class="bi bi-hourglass-split"></i>
    </div>
    <h2 class="fw-bold">429 - Too Many Requests</h2>
    <p class="text-muted">Rate limit exceeded. Please wait a few moments before trying again.</p>
    <a href="/" class="btn btn-primary rounded-pill px-4 mt-2">Return Home</a>
</div>
{% endblock %}
