{% extends "base.html" %}
{% block title %}404 - Not Found{% endblock %}
{% block body %}
<div class="container py-5 text-center">
    <div class="sh-stat-icon bg-secondary text-white mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2rem;">
        <i class="bi bi-question-circle-fill"></i>
    </div>
    <h2 class="fw-bold">404 - Page or Resource Not Found</h2>
    <p class="text-muted">The requested page or document does not exist in your tenant library.</p>
    <a href="/" class="btn btn-primary rounded-pill px-4 mt-2">Return to Dashboard</a>
</div>
{% endblock %}
