{% extends "base.html" %}

{% block title %}Change Password - StudyHub V2{% endblock %}

{% block body %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card sh-card shadow p-4">
                <div class="text-center mb-4">
                    <div class="sh-stat-icon bg-info text-white mx-auto mb-3">
                        <i class="bi bi-key-fill fs-3"></i>
                    </div>
                    <h4 class="fw-bold">Update Your Password</h4>
                    <p class="text-muted small">Please choose a secure password with at least 10 characters.</p>
                </div>

                <form method="POST" action="{{ url_for('auth.change_password') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Current Password</label>
                        <input type="password" name="current_password" class="form-control" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">New Password (min 10 characters)</label>
                        <input type="password" name="new_password" class="form-control" required minlength="10">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control" required minlength="10">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
                        <i class="bi bi-save me-1"></i> Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
